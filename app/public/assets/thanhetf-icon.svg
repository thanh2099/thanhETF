<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Forest Terminal Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08120A" />
      <stop offset="50%" stop-color="#0D1910" />
      <stop offset="100%" stop-color="#060E08" />
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6CD092" />
      <stop offset="100%" stop-color="#4EBE7D" />
    </linearGradient>

    <!-- Deep Look-Through Gradient -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EBE7D" />
      <stop offset="70%" stop-color="#156F41" />
      <stop offset="100%" stop-color="#0F3620" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="terminalGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#29372B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#terminalGrid)" />
  
  <!-- Outer Technical Border (0px radius brutalist style) -->
  <rect x="12" y="12" width="488" height="488" fill="none" stroke="#29372B" stroke-width="2" />
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#152318" stroke-width="1" />

  <!-- Corner Alignment Crosshairs -->
  <path d="M 12 36 L 36 36 L 36 12" fill="none" stroke="#4EBE7D" stroke-width="2" />
  <path d="M 500 36 L 476 36 L 476 12" fill="none" stroke="#4EBE7D" stroke-width="2" />
  <path d="M 12 476 L 36 476 L 36 500" fill="none" stroke="#4EBE7D" stroke-width="2" />
  <path d="M 500 476 L 476 476 L 476 500" fill="none" stroke="#4EBE7D" stroke-width="2" />

  <!-- Central Emblem: The Look-Through "T" Monogram -->
  <!-- Top Crossbar of 'T': Multi-layer ETF breakdown blocks -->
  <g id="t-crossbar">
    <!-- Block 1: Fund Wrapper (Left) -->
    <rect x="96" y="112" width="88" height="48" fill="#152318" stroke="#395542" stroke-width="2" />
    <text x="140" y="142" font-family="'Geist Mono', 'SF Mono', monospace" font-size="14" font-weight="700" fill="#919C92" text-anchor="middle">NAV</text>

    <!-- Block 2: Center Primary T-Cap -->
    <rect x="194" y="104" width="124" height="56" fill="url(#emeraldGrad)" />
    <text x="256" y="139" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="800" fill="#09150B" text-anchor="middle" letter-spacing="-0.02em">THANH</text>

    <!-- Block 3: Underlying Look-Through (Right) -->
    <rect x="328" y="112" width="88" height="48" fill="#152318" stroke="#395542" stroke-width="2" />
    <text x="372" y="142" font-family="'Geist Mono', 'SF Mono', monospace" font-size="14" font-weight="700" fill="#4EBE7D" text-anchor="middle">100%</text>

    <!-- Decode Accent Underline Bar across entire crossbar -->
    <rect x="96" y="168" width="320" height="4" fill="#4EBE7D" />
  </g>

  <!-- Vertical Stem of 'T': The 3-Tier Look-Through Decomposition -->
  <g id="t-stem">
    <!-- Tier 1: Canadian Broad Equity Layer (TSX/S&P) -->
    <rect x="220" y="184" width="72" height="68" fill="#193825" stroke="#4EBE7D" stroke-width="1.5" />
    <!-- Candlestick bar inside Tier 1 -->
    <line x1="256" y1="192" x2="256" y2="244" stroke="#4EBE7D" stroke-width="3" />
    <rect x="246" y="202" width="20" height="24" fill="#4EBE7D" />

    <!-- Tier 2: Global Look-Through Layer (Direct Equities) -->
    <rect x="220" y="260" width="72" height="68" fill="#152318" stroke="#395542" stroke-width="1.5" />
    <line x1="256" y1="268" x2="256" y2="320" stroke="#6CD092" stroke-width="2" />
    <rect x="248" y="276" width="16" height="26" fill="#6CD092" />

    <!-- Tier 3: Distribution & Yield Layer -->
    <rect x="220" y="336" width="72" height="68" fill="#0F2E1B" stroke="#294433" stroke-width="1.5" />
    <line x1="256" y1="344" x2="256" y2="396" stroke="#F69370" stroke-width="2" />
    <rect x="250" y="354" width="12" height="20" fill="#F69370" />
  </g>

  <!-- Diagonal Look-Through Rays (Decomposition Visualization) -->
  <path d="M 220 220 L 140 290 L 140 370" fill="none" stroke="#4EBE7D" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />
  <rect x="100" y="374" width="80" height="32" fill="#0D1910" stroke="#395542" stroke-width="1" />
  <text x="140" y="395" font-family="'Geist Mono', monospace" font-size="11" fill="#C7DACA" text-anchor="middle">EQUITIES</text>

  <path d="M 292 220 L 372 290 L 372 370" fill="none" stroke="#4EBE7D" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />
  <rect x="332" y="374" width="80" height="32" fill="#0D1910" stroke="#395542" stroke-width="1" />
  <text x="372" y="395" font-family="'Geist Mono', monospace" font-size="11" fill="#C7DACA" text-anchor="middle">INCOME</text>

  <!-- Bottom Brand Mark -->
  <text x="256" y="442" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.02em" text-anchor="middle">
    <tspan fill="#EFEBE1">THANH</tspan><tspan fill="#4EBE7D">ETF</tspan>
  </text>
  
  <!-- Decode Signature Underline (Base) -->
  <rect x="216" y="454" width="80" height="3" fill="#4EBE7D" />

  <text x="256" y="474" font-family="'Geist Mono', monospace" font-size="10" font-weight="500" fill="#919C92" letter-spacing="0.25em" text-anchor="middle">INTELLIGENCE TERMINAL</text>
</svg>
