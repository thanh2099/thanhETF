<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="beaverFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3525" />
      <stop offset="50%" stop-color="#382618" />
      <stop offset="100%" stop-color="#24180E" />
    </linearGradient>
    <linearGradient id="beaverBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B5B3E" />
      <stop offset="100%" stop-color="#5A402A" />
    </linearGradient>
    <linearGradient id="emeraldVest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EBE7D" />
      <stop offset="100%" stop-color="#1B633B" />
    </linearGradient>
  </defs>

  <!-- Tail (Paddle) with grid hatching -->
  <g id="tail" transform="translate(40, 180) rotate(-25)">
    <path d="M 0 0 C -20 40 -20 90 20 100 C 60 90 60 40 40 0 Z" fill="#1C140D" stroke="#3A281A" stroke-width="3" />
    <path d="M 0 20 L 40 60 M -5 40 L 45 80 M 5 70 L 35 100" stroke="#3A281A" stroke-width="2" />
  </g>

  <!-- Beaver Body -->
  <ellipse cx="140" cy="190" rx="65" ry="75" fill="url(#beaverFur)" />
  <ellipse cx="140" cy="205" rx="42" ry="50" fill="url(#beaverBelly)" />

  <!-- Technical Terminal Vest (Brutalist Emerald) -->
  <path d="M 105 150 L 175 150 L 185 220 L 95 220 Z" fill="url(#emeraldVest)" opacity="0.9" stroke="#123B22" stroke-width="2" />
  <rect x="110" y="165" width="22" height="12" fill="#0D1910" stroke="#4EBE7D" stroke-width="1" />
  <text x="121" y="174" font-family="'Geist Mono', monospace" font-size="7" font-weight="bold" fill="#4EBE7D" text-anchor="middle">ETF</text>

  <!-- Head -->
  <ellipse cx="150" cy="115" rx="50" ry="46" fill="url(#beaverFur)" />

  <!-- Ears -->
  <circle cx="115" cy="80" r="14" fill="#382618" stroke="#24180E" stroke-width="2" />
  <circle cx="115" cy="80" r="8" fill="#5A402A" />
  <circle cx="185" cy="80" r="14" fill="#382618" stroke="#24180E" stroke-width="2" />
  <circle cx="185" cy="80" r="8" fill="#5A402A" />

  <!-- Snout / Cheeks -->
  <ellipse cx="150" cy="130" rx="30" ry="22" fill="#6A4E34" />
  <!-- Nose -->
  <polygon points="144,120 156,120 150,128" fill="#18110B" />

  <!-- Buck Teeth (Signature Beaver) -->
  <rect x="144" y="138" width="6" height="12" fill="#FAF5EA" stroke="#18110B" stroke-width="1.5" />
  <rect x="150" y="138" width="6" height="12" fill="#FAF5EA" stroke="#18110B" stroke-width="1.5" />

  <!-- Focused Eyes with Emerald Reflection -->
  <circle cx="132" cy="105" r="7" fill="#18110B" />
  <circle cx="134" cy="103" r="2.5" fill="#4EBE7D" />
  <circle cx="168" cy="105" r="7" fill="#18110B" />
  <circle cx="170" cy="103" r="2.5" fill="#4EBE7D" />

  <!-- Left Arm (Resting) -->
  <path d="M 85 170 Q 75 195 90 215" fill="none" stroke="#382618" stroke-width="18" stroke-linecap="round" />

  <!-- Right Arm (Presenting Gesturing Forward towards Terminal Console) -->
  <path d="M 185 165 Q 235 150 265 135" fill="none" stroke="#382618" stroke-width="18" stroke-linecap="round" />
  <!-- Presenting Paw with Claw Accent -->
  <circle cx="268" cy="133" r="12" fill="#24180E" />
  <polygon points="268,125 285,128 274,136" fill="#4EBE7D" />

  <!-- Feet (Grounded) -->
  <ellipse cx="110" cy="265" rx="20" ry="10" fill="#24180E" />
  <ellipse cx="170" cy="265" rx="20" ry="10" fill="#24180E" />
</svg>
